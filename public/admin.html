<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HyperFox Chat — Управление</title>
<link rel="stylesheet" href="/style.css" />
<link rel="icon" id="favicon" type="image/png" href="/favicon.png" />
<script>(function(){try{var s=localStorage.getItem("hfc_theme")||"system";var d=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;var e=(s==="system")?(d?"dark":"light"):s;document.documentElement.setAttribute("data-theme",e);var l=document.getElementById("favicon");if(l)l.href=(e==="dark")?"/favicon-white.png":"/favicon-black.png";}catch(err){}})();</script>
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style>
.toggle { position: relative; display: inline-block; width: 46px; height: 26px; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider { position: absolute; cursor: pointer; inset: 0; background: var(--surface-hover); border: 1px solid var(--border); transition: .2s; border-radius: 999px; }
.toggle-slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 3px; background: var(--muted); transition: .2s; border-radius: 50%; }
.toggle input:checked + .toggle-slider { background: var(--accent-soft); border-color: var(--accent); }
.toggle input:checked + .toggle-slider:before { transform: translateX(18px); background: var(--accent); }
.user-row { display:flex; align-items:center; gap:10px; }
.user-row .avatar { width: 32px; height: 32px; font-size: 14px; }
</style>
</head>
<body>
  <nav class="nav" data-nav></nav>

  <div class="container-narrow">
    <div class="forum-head" style="margin-top:20px">
      <div>
        <h1 style="font-size:24px">Управление</h1>
        <div class="sub">Настройки и пользователи</div>
      </div>
    </div>

    <div class="card" style="max-width:100%;margin:18px 0">
      <h2 style="font-size:18px;margin-bottom:10px">Основные настройки</h2>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 0">
        <div>
          <div style="font-weight:600">Требовать инвайт при регистрации</div>
          <div style="color:var(--muted);font-size:13px">Если включено - регистрация только по инвайту</div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="requireInvite" />
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div id="configRes" class="result"></div>
    </div>

    <div class="card" style="max-width:100%;margin:18px 0;overflow:visible">
      <h2 style="font-size:18px;margin-bottom:10px">Пользователи</h2>
      <div style="overflow:visible">
        <table style="width:100%;border-collapse:collapse;font-size:14px">
          <thead>
            <tr style="text-align:left;color:var(--muted)">
              <th style="padding:10px;border-bottom:1px solid var(--border)">Пользователь</th>
              <th style="padding:10px;border-bottom:1px solid var(--border)">Роль</th>
              <th style="padding:10px;border-bottom:1px solid var(--border)">Управление сайтом</th>
              <th style="padding:10px;border-bottom:1px solid var(--border)">Создание инвайтов</th>
            </tr>
          </thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>
    </div>
  </div>

<script src="/app.js"></script>
<script>
  NS.renderNav("admin");
  async function load() {
    const me = await NS.requireAuth();
    if (!me) return;
    const { data } = await NS.api("/api/site?action=admin", { method: "GET" });
    if (!data || !data.ok) {
      alert("Нет доступа");
      location.href = "/";
      return;
    }
    const reqInv = document.getElementById("requireInvite");
    reqInv.checked = !!data.config.requireInvite;
    reqInv.onchange = async () => {
      await NS.api("/api/site?action=admin", { method: "POST", body: { action: "toggleInvite", requireInvite: reqInv.checked } });
    };

    const ub = document.getElementById("usersBody");
    ub.innerHTML = (data.users || []).map(u => {
      const uidn = Number(u.uid);
      const isSpecial = uidn === 1 || uidn === 2;
      const canEdit = (me.uid == "1" || me.uid == "2") && !isSpecial;
      const canMakeOwner = me.uid == "1" && !isSpecial;
      const canDelete = (me.uid == "1" || me.uid == "2" || me.role === "owner" || me.role === "coder") && !isSpecial;
      let roleSel = u.role === "owner" ? "Owner" : u.role === "coder" ? "Coder" : "Member";
      if (canEdit) {
        const roles = [{v:'member',l:'Member'},{v:'coder',l:'Coder'}];
        if (canMakeOwner) roles.push({v:'owner',l:'Owner'});
        const cur = u.role || 'member';
        roleSel = '<div class="custom-select" data-uid="' + NS.escape(u.uid) + '" data-role="' + NS.escape(cur) + '">' +
          '<button class="custom-select-trigger" type="button"><span class="custom-select-value">' + NS.escape(cur === 'owner'?'Owner':cur === 'coder'?'Coder':'Member') + '</span><span class="custom-select-arrow"></span></button>' +
          '<div class="custom-select-menu">' +
          roles.map(r=>'<div class="custom-select-item" data-value="'+NS.escape(r.v)+'">'+NS.escape(r.l)+'</div>').join('') +
          '</div>' +
        '</div>';
      }
      const manage = (uidn === 1 || uidn === 2 || u.canManage === true);
      const invite = (uidn === 1 || uidn === 2 || u.canInvite === true);
      const toggleManage = '<label class="toggle"><input type="checkbox" data-manage="' + NS.escape(u.uid) + '" ' + (manage ? 'checked' : '') + ' ' + ((canEdit && !isSpecial) ? '' : 'disabled') + ' /><span class="toggle-slider"></span></label>';
      const toggleInvite = '<label class="toggle"><input type="checkbox" data-inviteperm="' + NS.escape(u.uid) + '" ' + (invite ? 'checked' : '') + ' ' + ((canEdit && !isSpecial) ? '' : 'disabled') + ' /><span class="toggle-slider"></span></label>';
      const del = canDelete ? '<button class="btn btn-ghost" style="width:auto;padding:6px 10px;color:#f87171" data-del="' + NS.escape(u.uid) + '">Удалить</button>' : '';
      return '<tr>' +
        '<td style="padding:10px;border-bottom:1px solid var(--border)"><div class="user-row">' + NS.avatarHTML(u.username, u.uid, "avatar") + '<div><div style="font-weight:600">' + NS.escape(u.username) + '</div><div style="color:var(--muted);font-size:12px">UID ' + NS.escape(u.uid||'') + '</div></div></div></td>' +
        '<td style="padding:10px;border-bottom:1px solid var(--border)">' + roleSel + '</td>' +
        '<td style="padding:10px;border-bottom:1px solid var(--border)">' + toggleManage + '</td>' +
        '<td style="padding:10px;border-bottom:1px solid var(--border)">' + toggleInvite + '</td>' +
        '<td style="padding:10px;border-bottom:1px solid var(--border)">' + del + '</td>' +
      '</tr>';
    }).join('');
    function positionMenu(cs) {
      const trigger = cs.querySelector('.custom-select-trigger');
      const menu = cs.querySelector('.custom-select-menu');
      if (!trigger || !menu) return;
      const rect = trigger.getBoundingClientRect();
      menu.style.position = 'fixed';
      menu.style.left = rect.left + 'px';
      menu.style.top = rect.bottom + 4 + 'px';
      menu.style.width = rect.width + 'px';
      menu.style.zIndex = '99999';
    }
    ub.querySelectorAll('.custom-select').forEach(cs => {
      const trigger = cs.querySelector('.custom-select-trigger');
      const menu = cs.querySelector('.custom-select-menu');
      const items = cs.querySelectorAll('.custom-select-item');
      const valEl = cs.querySelector('.custom-select-value');
      if (menu && menu.parentNode !== document.body) document.body.appendChild(menu);
      trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.custom-select.open').forEach(x => { if (x !== cs) { x.classList.remove('open'); const m = x.querySelector('.custom-select-menu'); if(m && m.parentNode===document.body) m.style.display='none'; } });
        if (cs.classList.contains('open')) {
          cs.classList.remove('open');
          if (menu && menu.parentNode === document.body) menu.style.display = 'none';
          return;
        }
        if (menu && menu.parentNode !== document.body) document.body.appendChild(menu);
        positionMenu(cs);
        if (menu) menu.style.display = 'flex';
        cs.classList.add('open');
      });
      items.forEach(it => it.addEventListener('click', async (e) => {
        e.stopPropagation();
        const v = it.getAttribute('data-value');
        const uid = cs.getAttribute('data-uid');
        valEl.textContent = it.textContent;
        cs.classList.remove('open');
        if (menu && menu.parentNode === document.body) menu.style.display = 'none';
        await NS.api("/api/site?action=admin", { method: "POST", body: { action: "setRole", uid, role: v } });
        load();
      }));
    });
    document.addEventListener('click', () => {
      document.querySelectorAll('.custom-select.open').forEach(x => { x.classList.remove('open'); const m = x.querySelector('.custom-select-menu'); if(m && m.parentNode===document.body) m.style.display='none'; });
    });
    window.addEventListener('scroll', () => {
      document.querySelectorAll('.custom-select.open').forEach(cs => positionMenu(cs));
    }, true);
    window.addEventListener('resize', () => {
      document.querySelectorAll('.custom-select.open').forEach(cs => positionMenu(cs));
    });
    ub.querySelectorAll('input[data-manage]').forEach(inp => inp.addEventListener('change', async () => {
      if (inp.disabled) return;
      const uid = inp.getAttribute('data-manage');
      await NS.api("/api/site?action=admin", { method: "POST", body: { action: "setPerm", uid, perm: "manage", value: inp.checked } });
      load();
    }));
    ub.querySelectorAll('input[data-inviteperm]').forEach(inp => inp.addEventListener('change', async () => {
      if (inp.disabled) return;
      const uid = inp.getAttribute('data-inviteperm');
      await NS.api("/api/site?action=admin", { method: "POST", body: { action: "setPerm", uid, perm: "invite", value: inp.checked } });
      load();
    }));
    ub.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', async () => {
      const uid = btn.getAttribute('data-del');
      if (!confirm("Удалить пользователя с UID " + uid + "? Это действие необратимо.")) return;
      await NS.api("/api/site?action=admin", { method: "POST", body: { action: "deleteUser", uid } });
      load();
    }));
  }

  load();
</script>
</body>
</html>
